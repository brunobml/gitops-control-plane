# 2026-10-03 Track A.1: offline render + schema validation of everything Argo CD deploys, alert rule
# tests, dashboards, shell and secret checks. Same script as `make ci` (ci/check-control-plane.sh).
# O-1 mixed mode: post-push alarm on main (direct pushes stay allowed); also runs on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ci/labci/go.mod
          cache-dependency-path: ci/labci/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r ci/requirements.txt
      - run: ci/check-control-plane.sh
