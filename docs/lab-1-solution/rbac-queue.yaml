# Lab 1 stretch (step 6): kro may also manage ACK SQS queues for WebGreeting.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro-web-greeting-queue
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
rules:
  - apiGroups: ["sqs.services.k8s.aws"]
    resources: ["queues"]
    verbs: ["*"]
