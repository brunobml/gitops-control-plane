# P0 spike values (throwaway cluster iac-spike, moto-spike). Image pinned by index digest from the registry.
image:
  tag: "1.21.2@sha256:c0a979b313b01f3be752434a838a028f80b4c45dcaeb10f1fc85f745574c3f02"
aws:
  region: "us-east-1"
  endpoint_url: "http://moto-spike:5000"
  allow_unsafe_aws_endpoint_urls: true
  credentials:
    secretName: "ack-aws-creds"
    secretKey: "credentials"
    profile: "default"
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 250m, memory: 384Mi}
reconcile:
  defaultResyncPeriod: 300
  resources: [VPC,Subnet,InternetGateway,RouteTable,SecurityGroup]
featureGates:
  IgnoreFieldDrift: true
