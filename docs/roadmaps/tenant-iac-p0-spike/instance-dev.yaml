apiVersion: v1
kind: Namespace
metadata:
  name: iac-team-data-dev
  labels: {pod-security.kubernetes.io/enforce: restricted}
  annotations: {services.k8s.aws/owner-account-id: "111111111111"}
---
apiVersion: kro.run/v1alpha1
kind: TeamEKSCluster
metadata: {name: analytics-dev, namespace: iac-team-data-dev}
spec:
  team: team-data
  name: analytics
  env: dev
  kubernetesVersion: "1.31"
  network: platform-default
  nodeGroup: {instanceType: t3.medium, minSize: 1, desiredSize: 2, maxSize: 3}
