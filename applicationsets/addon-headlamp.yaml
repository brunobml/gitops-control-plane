apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-headlamp
  namespace: argocd
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: platform-addons
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: control-plane
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.45.0
    helm:
      releaseName: headlamp
      valuesObject:
        automountServiceAccountToken: false
        clusterRoleBinding:
          create: false
        config:
          inCluster: false
          extraArgs:
            - "-kubeconfig=/home/headlamp/.kube/config"
            - "-dev"
          oidc:
            secret:
              create: false
        probes:
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
        volumeMounts:
          - name: kubeconfig
            mountPath: /home/headlamp/.kube/config
            subPath: config
            readOnly: true
        volumes:
          - name: kubeconfig
            secret:
              secretName: headlamp-kubeconfig
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            argocd.argoproj.io/ignore-default-links: "true"
            link.argocd.argoproj.io/external-link: "http://headlamp.localhost:8080"
          hosts:
            - host: headlamp.localhost
              paths:
                - path: /
                  type: Prefix
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
