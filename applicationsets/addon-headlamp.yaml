apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-headlamp
  namespace: argocd
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: platform-addons
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: control-plane
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.45.0
    helm:
      releaseName: headlamp
      valuesObject:
        # 2026-10-03 Step 0.6 (L3-1): pinned by digest; bump together with targetRevision.
        image:
          tag: "v0.45.0@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49"
        automountServiceAccountToken: false
        clusterRoleBinding:
          create: false
        config:
          inCluster: false
          extraArgs:
            - "-kubeconfig=/home/headlamp/.kube/config"
          oidc:
            secret:
              create: false
        probes:
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
        volumeMounts:
          - name: kubeconfig
            mountPath: /home/headlamp/.kube/config
            subPath: config
            readOnly: true
        volumes:
          - name: kubeconfig
            secret:
              secretName: headlamp-kubeconfig
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            argocd.argoproj.io/ignore-default-links: "true"
            # Phase 4 A.5: SSO via oauth2-proxy (addon-oauth2-proxy owns this Middleware).
            traefik.ingress.kubernetes.io/router.middlewares: headlamp-oauth2-forward-auth@kubernetescrd
            link.argocd.argoproj.io/external-link: "http://headlamp.localhost"
          hosts:
            - host: headlamp.localhost
              paths:
                - path: /
                  type: Prefix
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # 2026-10-03 Track C.1 (L4-5, O-9): Pod Security baseline. Every workload of this app,
        # Helm hook Jobs included, was dry-run under this level first (review remark R-13).
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
