# Phase 4 C.2 (L2-3): tenant self-registration. One ApplicationSet for all tenants and
# environments, generated from data files in the tenant-workloads repository:
#   tenants/<tenant>/apps/<app>-<env>.yaml   (tenant, app, env, port, valuesRevision[, valuesFile])
# A tenant onboards an app environment with a pull request in tenant-workloads; no change to
# this control-plane repository is needed. Tenants supply data only; everything else is fixed
# here and guarded by the tenant-workloads AppProject (namespaces orders-*, allowed kinds).
#
# Guardrails in the template (rendering fails, nothing is created or changed):
# - env must be dev, test or prod. The platform, not the tenant, maps env to the spoke and to
#   the AWS account (prod -> spoke-prod / 222222222222, otherwise spoke-nonprod / 111111111111).
# - prod must pin valuesRevision to a full commit SHA (the Phase 2 promotion gate).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/brunobml/tenant-workloads.git
        revision: main
        files:
          - path: "tenants/*/apps/*.yaml"
  template:
    metadata:
      name: '{{ if not (has .env (list "dev" "test" "prod")) }}{{ fail "tenant registration: env must be dev, test or prod" }}{{ end }}{{ if and (eq .env "prod") (not (regexMatch "^[0-9a-f]{40}$" .valuesRevision)) }}{{ fail "tenant registration: prod valuesRevision must be a full 40-character commit SHA" }}{{ end }}{{ .app }}-{{ .env }}'
      labels:
        app.kubernetes.io/name: "{{ .app }}"
        app: "{{ .app }}"
        environment: "{{ .env }}"
        team: "e-commerce"
        tier: "backend"
        framework: "kro-ack"
      annotations:
        link.argocd.argoproj.io/external-link: "http://{{ .app }}-{{ .env }}.localhost:{{ .port }}"
        link.argocd.argoproj.io/dashboard: "http://{{ .app }}-{{ .env }}.localhost:{{ .port }}"
        link.argocd.argoproj.io/source-code: "https://github.com/brunobml/orders-processor"
        link.argocd.argoproj.io/platform-chart: "https://github.com/brunobml/platform-charts"
        description: "Orders processing microservice with AWS SQS & DynamoDB via Kro"
    spec:
      project: tenant-workloads
      info:
        - name: "Application"
          value: "Orders Processor"
        - name: "Environment"
          value: "{{ .env }}"
        - name: "Team"
          value: "E-Commerce Squad"
        - name: "Live Dashboard"
          value: "http://{{ .app }}-{{ .env }}.localhost:{{ .port }}"
        - name: "Source Code"
          value: "https://github.com/brunobml/orders-processor"
        - name: "Platform Golden Chart"
          value: "ghcr.io/brunobml/charts/queue-backed-service:1.0.0"
        - name: "Central Moto Cloud"
          value: "http://localhost:5000/moto-api/"
      sources:
        - chart: queue-backed-service
          repoURL: ghcr.io/brunobml/charts
          targetRevision: 1.0.0
          helm:
            valueFiles:
              # optional valuesFile in the registration; default deploy/values-<env>.yaml
              - '$values/{{ dig "valuesFile" (printf "deploy/values-%s.yaml" .env) . }}'
        - repoURL: https://github.com/brunobml/orders-processor.git
          targetRevision: '{{ .valuesRevision }}'
          ref: values
      destination:
        name: '{{ if eq .env "prod" }}spoke-prod{{ else }}spoke-nonprod{{ end }}'
        namespace: "{{ .app }}-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
            # Phase 4 B.4: opt in to Kyverno image signature verification.
            platform.lab/image-verification: "enabled"
          # Phase 3 D.3 (L4-4): each environment's cloud resources live in its own account (ACK CARM).
          annotations:
            services.k8s.aws/owner-account-id: '{{ if eq .env "prod" }}222222222222{{ else }}111111111111{{ end }}'
