apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-workloads-prod
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - app: orders
            tenant: tenant-a
            env: prod
            port: "8082"
            valuesRevision: 8f88f7eb521e7e21ca107f59b4e61870675bad45
  template:
    metadata:
      name: "{{app}}-{{env}}"
      labels:
        app.kubernetes.io/name: "{{app}}"
        app: "{{app}}"
        environment: "{{env}}"
        team: "e-commerce"
        tier: "backend"
        framework: "kro-ack"
      annotations:
        link.argocd.argoproj.io/external-link: "http://orders-{{env}}.localhost:{{port}}"
        link.argocd.argoproj.io/dashboard: "http://orders-{{env}}.localhost:{{port}}"
        link.argocd.argoproj.io/source-code: "https://github.com/brunobml/orders-processor"
        link.argocd.argoproj.io/platform-chart: "https://github.com/brunobml/platform-charts"
        description: "Orders processing microservice with AWS SQS & DynamoDB via Kro"
    spec:
      project: tenant-workloads
      info:
        - name: "Application"
          value: "Orders Processor"
        - name: "Environment"
          value: "{{env}}"
        - name: "Team"
          value: "E-Commerce Squad"
        - name: "Live Dashboard"
          value: "http://orders-{{env}}.localhost:{{port}}"
        - name: "Source Code"
          value: "https://github.com/brunobml/orders-processor"
        - name: "Platform Golden Chart"
          value: "ghcr.io/brunobml/charts/queue-backed-service:1.0.0"
        - name: "Central Moto Cloud"
          value: "http://localhost:5000/moto-api/"
      sources:
        - chart: queue-backed-service
          repoURL: ghcr.io/brunobml/charts
          targetRevision: 1.0.0
          helm:
            valueFiles:
              - $values/deploy/values-{{env}}.yaml
        - repoURL: https://github.com/brunobml/orders-processor.git
          targetRevision: '{{valuesRevision}}'
          ref: values
      destination:
        name: spoke-prod
        namespace: "{{app}}-{{env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
          # Phase 3 D.3 (L4-4): prod cloud resources live in account 222222222222 (ACK CARM).
          annotations:
            services.k8s.aws/owner-account-id: "222222222222"
