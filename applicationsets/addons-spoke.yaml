# Phase 3 B.2 (L2-1, L3-8): spoke platform controllers managed from Git instead of
# `helm upgrade --install` in setup-hub-spoke.sh.
#
# - A cluster opts in with the label addons-managed=true on its Argo CD cluster Secret
#   (written by scripts/register-spokes.sh). Adoption was done one cluster at a time
#   with manual syncs after reviewing the diff; automated sync was enabled afterwards.
# - Controller values come from platform-catalog at the cluster's blueprints-revision
#   (nonprod: main, prod: a release tag), so controller config goes through the same
#   promotion gate as the blueprints.
# - releaseName matches the original Helm releases, so Argo CD adopts the existing objects.
# - preserveResourcesOnDeletion (reviewer remark R-2): removing a cluster label or this
#   ApplicationSet never deletes the controllers.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-spoke
  namespace: argocd
spec:
  # Phase 4 C.1 (L2-4): Go templates; a missing key fails rendering instead of producing "".
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  addons-managed: "true"
          - list:
              elements:
                - addon: kro
                  chart: kro
                  chartRepo: registry.k8s.io/kro/charts
                  chartVersion: "0.9.4"
                  releaseName: kro
                  targetNamespace: kro
                  valuesFile: controllers/kro/values-kro.yaml
                - addon: ack-sqs
                  chart: sqs-chart
                  chartRepo: public.ecr.aws/aws-controllers-k8s
                  chartVersion: "1.7.1"
                  releaseName: ack-sqs-controller
                  targetNamespace: ack-system
                  valuesFile: controllers/ack/values-sqs.yaml
                - addon: ack-ec2
                  chart: ec2-chart
                  chartRepo: public.ecr.aws/aws-controllers-k8s
                  chartVersion: "1.21.2"
                  releaseName: ack-ec2-controller
                  targetNamespace: ack-system
                  valuesFile: controllers/ack/values-ec2.yaml
                - addon: ack-iam
                  chart: iam-chart
                  chartRepo: public.ecr.aws/aws-controllers-k8s
                  chartVersion: "1.9.1"
                  releaseName: ack-iam-controller
                  targetNamespace: ack-system
                  valuesFile: controllers/ack/values-iam.yaml
                - addon: ack-eks
                  chart: eks-chart
                  chartRepo: public.ecr.aws/aws-controllers-k8s
                  chartVersion: "1.23.1"
                  releaseName: ack-eks-controller
                  targetNamespace: ack-system
                  valuesFile: controllers/ack/values-eks.yaml
  template:
    metadata:
      name: "addon-{{ .addon }}-{{ .name }}"
      labels:
        app.kubernetes.io/part-of: platform-addons
        addon: "{{ .addon }}"
    spec:
      project: platform-addons
      sources:
        - chart: "{{ .chart }}"
          repoURL: "{{ .chartRepo }}"
          targetRevision: "{{ .chartVersion }}"
          helm:
            releaseName: "{{ .releaseName }}"
            valueFiles:
              - "$values/{{ .valuesFile }}"
        - repoURL: https://github.com/brunobml/platform-catalog.git
          targetRevision: '{{ index .metadata.annotations "blueprints-revision" }}'
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: "{{ .targetNamespace }}"
      syncPolicy:
        # Enabled after both spokes were adopted with a reviewed, manual first sync.
        # prune stays off: a chart upgrade that drops an object leaves it orphaned
        # rather than deleting it (safe default for CRD-bearing controller charts).
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        managedNamespaceMetadata:
          labels:
            # 2026-10-03 Track C.1 (L4-5, O-9): Pod Security restricted. Every workload of this app,
            # Helm hook Jobs included, was dry-run under this level first (review remark R-13).
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
