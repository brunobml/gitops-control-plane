# Phase 5 F.2: Alloy on the hub (pod logs + Kubernetes events -> Loki in-cluster).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-alloy
  namespace: argocd
  labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: platform-control-plane}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: control-plane
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        releaseName: alloy
        valueFiles: [$values/addons/observability/values-alloy-hub.yaml]
    - repoURL: https://github.com/brunobml/gitops-control-plane.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
