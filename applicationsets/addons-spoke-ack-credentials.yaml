# Phase 3 B.2: the ACK credentials Secret (mock values for the moto lab) from
# platform-catalog/controllers/ack/credentials-secret.yaml, per opted-in spoke.
# In production this Secret does not exist: ACK uses EKS Pod Identity / IRSA instead.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-spoke-ack-credentials
  namespace: argocd
spec:
  # Phase 4 C.1 (L2-4): Go templates; a missing key fails rendering instead of producing "".
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # TEMPORARY (Phase 4 C.1 migration guard): never delete Applications while templates change.
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            addons-managed: "true"
  template:
    metadata:
      name: "addon-ack-credentials-{{ .name }}"
      labels:
        app.kubernetes.io/part-of: platform-addons
        addon: ack-credentials
    spec:
      project: platform-addons
      source:
        repoURL: https://github.com/brunobml/platform-catalog.git
        targetRevision: '{{ index .metadata.annotations "blueprints-revision" }}'
        path: controllers/ack
        directory:
          # D.3: the CARM account map ships with the credentials, gated by blueprints-revision.
          include: "{credentials-secret.yaml,carm-account-map.yaml}"
      destination:
        server: "{{ .server }}"
        namespace: ack-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
