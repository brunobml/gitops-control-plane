# Phase 4 B.3: Kyverno (image signature verification) on spokes labelled kyverno=enabled.
# Separate from addons-spoke so it can be rolled out one cluster at a time (it was enabled on
# spoke-nonprod first, then on spoke-prod with platform-catalog v1.4.0). register-spokes.sh sets
# the label on both spokes, so a rebuild deploys it everywhere. Values come from platform-catalog at the cluster's
# blueprints-revision, like the other controllers.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-spoke-kyverno
  namespace: argocd
spec:
  # Phase 4 C.1 (L2-4): Go templates; a missing key fails rendering instead of producing "".
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            addons-managed: "true"
            kyverno: enabled
  template:
    metadata:
      name: "addon-kyverno-{{ .name }}"
      labels:
        app.kubernetes.io/part-of: platform-addons
        addon: kyverno
    spec:
      project: platform-addons
      sources:
        - chart: kyverno
          repoURL: https://kyverno.github.io/kyverno/
          targetRevision: "3.9.1"
          helm:
            releaseName: kyverno
            valueFiles:
              - "$values/controllers/kyverno/values-kyverno.yaml"
            parameters:
              # Policy Reporter consumes PolicyReports. The catalog's admission-only
              # default disables their producer, so enable it on both spokes.
              - name: reportsController.enabled
                value: "true"
        - repoURL: https://github.com/brunobml/platform-catalog.git
          targetRevision: '{{ index .metadata.annotations "blueprints-revision" }}'
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: kyverno
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Kyverno CRDs exceed the client-side apply annotation limit.
          - ServerSideApply=true
        managedNamespaceMetadata:
          labels:
            # 2026-10-03 Track C.1 (L4-5, O-9): Pod Security restricted. Every workload of this app,
            # Helm hook Jobs included, was dry-run under this level first (review remark R-13).
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
