# Phase 3 B.3: hub Traefik managed from Git (chart pinned to the deployed 41.6.1, default
# values, same release name, so Argo CD adopts the existing objects in place).
# setup-hub-spoke.sh still installs this exact version once at bootstrap, because the Argo CD
# UI/CLI ingress depends on it before the root app exists; Argo CD takes ownership after
# `make bootstrap`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-traefik
  namespace: argocd
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: platform-control-plane
spec:
  project: control-plane
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.6.1
    helm:
      releaseName: traefik
      # 2026-10-03 Step 0.6 (L3-1): pinned by digest; bump together with targetRevision.
      valuesObject:
        image:
          tag: "v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0"
        # 2026-10-03 Track I.4 (O-7): HTTPS presents the lab certificate (Secret traefik/local-tls,
        # created outside Git by scripts/setup-local-tls.sh: mkcert-issued, or a self-signed
        # fallback) and answers every request with a redirect to the same URL over HTTP, the path
        # SSO uses. Nothing is served over HTTPS itself until SSO moves to HTTPS.
        tlsStore:
          default:
            defaultCertificate:
              secretName: local-tls
        ports:
          websecure:
            http:
              middlewares:
                - traefik-redirect-to-http@kubernetescrd
        extraObjects:
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: redirect-to-http
              namespace: traefik
            spec:
              redirectScheme:
                scheme: http
                permanent: false
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    # Enabled after the reviewed manual adoption sync (diff was tracking metadata only).
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # 2026-10-03 Track C.1 (L4-5, O-9): Pod Security restricted. Every workload of this app,
        # Helm hook Jobs included, was dry-run under this level first (review remark R-13).
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
