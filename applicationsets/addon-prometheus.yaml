# Phase 5 A.1: hub Prometheus + Alertmanager + kube-state-metrics. Values (incl. alert rules)
# in addons/observability/values-prometheus-hub.yaml; secrets from scripts/setup-observability-secrets.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: platform-control-plane
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: control-plane
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.35.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/addons/observability/values-prometheus-hub.yaml
    - repoURL: https://github.com/brunobml/gitops-control-plane.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # Phase 5 F.0: Pod Security restricted (all monitoring workloads verified with --dry-run=server)
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
