# Phase 5 A.3/B.2: Prometheus agent and synthetic order probe on spokes labelled observability=enabled
# (rolled out nonprod first, prod with platform-catalog v1.5.0; register-spokes.sh labels both). Values from platform-catalog
# at the cluster's blueprints-revision; the cluster name and the remote-write user come from here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-spoke-observability
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            addons-managed: "true"
            observability: enabled
  template:
    metadata:
      name: "addon-observability-{{ .name }}"
      labels:
        app.kubernetes.io/part-of: platform-addons
        addon: observability
    spec:
      project: platform-addons
      sources:
        - chart: prometheus
          repoURL: https://prometheus-community.github.io/helm-charts
          targetRevision: "29.35.0"
          helm:
            releaseName: prometheus-agent
            valueFiles:
              - "$values/controllers/observability/values-agent.yaml"
            parameters:
              - name: server.global.external_labels.cluster
                value: "{{ .name }}"
              - name: server.remoteWrite[0].basic_auth.username
                value: "{{ .name }}"
        - repoURL: https://github.com/brunobml/platform-catalog.git
          targetRevision: '{{ index .metadata.annotations "blueprints-revision" }}'
          ref: values
        # Phase 5 B.2: synthetic order probe (platform code, not promoted per spoke)
        - repoURL: https://github.com/brunobml/gitops-control-plane.git
          targetRevision: main
          path: addons/probes
        # admission self-test namespace for the smoke test's dry-run probes (Gate 11b/11c)
        - repoURL: https://github.com/brunobml/gitops-control-plane.git
          targetRevision: main
          path: addons/admission-probes
      destination:
        server: "{{ .server }}"
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        managedNamespaceMetadata:
          labels:
            # Phase 5 F.0: Pod Security restricted (all monitoring workloads verified with --dry-run=server)
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
