apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kro-blueprints
  namespace: argocd
spec:
  # Phase 4 C.1 (L2-4): Go templates; a missing key fails rendering instead of producing "".
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # TEMPORARY (Phase 4 C.1 migration guard): never delete Applications while templates change.
    applicationsSync: create-update
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - nonprod
                - prod
  template:
    metadata:
      name: "kro-blueprints-{{ .name }}"
    spec:
      project: platform-catalog
      source:
        repoURL: https://github.com/brunobml/platform-catalog.git
        targetRevision: '{{ index .metadata.annotations "blueprints-revision" }}'
        path: blueprints
      destination:
        server: "{{ .server }}"
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
