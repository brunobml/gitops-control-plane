# Phase 5 A.4: Grafana (Keycloak SSO), datasources Prometheus + Alertmanager, dashboards as code.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-grafana
  namespace: argocd
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: platform-control-plane
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: control-plane
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.2.7
      helm:
        releaseName: grafana
        valueFiles:
          - $values/addons/observability/values-grafana.yaml
    - repoURL: https://github.com/brunobml/gitops-control-plane.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/brunobml/gitops-control-plane.git
      targetRevision: main
      path: addons/observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
