# Argo CD Helm values for the hub.
# Phase 3 B.4: Argo CD manages itself from this file via the argo-cd Application
# (applicationsets/argo-cd.yaml, manual sync by design). To change Argo CD: commit here, then
# sync the argo-cd app as platform-admin. Do not `helm upgrade` except as break-glass.
global:
  domain: localhost:8080

server:
  extraArgs:
    - --insecure
  service:
    type: ClusterIP
    servicePortHttp: 80
    servicePortHttps: 443
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: localhost
    path: /
    pathType: Prefix
    extraHosts:
      - name: argocd.localhost
        path: /

# Phase 4 A.4: SSO is Keycloak via Argo CD's native OIDC (oidc.config below), so Dex is not
# deployed (P4-2).
dex:
  enabled: false

configs:
  params:
    server.insecure: true
  repositories:
    ghcr-charts:
      type: helm
      name: ghcr-charts
      url: ghcr.io/brunobml/charts
      enableOCI: "true"
    headlamp:
      type: helm
      name: headlamp
      url: https://kubernetes-sigs.github.io/headlamp/
    # Phase 3 B.2: public OCI registries for the spoke controllers (anonymous pulls).
    kro-charts:
      type: helm
      name: kro-charts
      url: registry.k8s.io/kro/charts
      enableOCI: "true"
    ack-charts:
      type: helm
      name: ack-charts
      url: public.ecr.aws/aws-controllers-k8s
      enableOCI: "true"
  # No admin password in Git (Phase 3 A.2). The built-in admin account is disabled below;
  # use the local accounts. Passwords live only in argocd-secret (see `make password`).
  # Helm must not own argocd-secret: the chart renders it from values only, so every
  # upgrade would drop the account passwords Argo CD writes at runtime. The live Secret
  # carries helm.sh/resource-policy=keep so Helm leaves it in place.
  secret:
    createSecret: false
  rbac:
    # Deny by default; access is granted only through the roles below (Phase 3 A.2).
    policy.default: ""
    policy.csv: |
      g, platform-admin, role:admin
      p, role:tenant-a, projects,     get,  tenant-workloads, allow
      p, role:tenant-a, applications, get,  tenant-workloads/*, allow
      p, role:tenant-a, applications, sync, tenant-workloads/orders-dev, allow
      p, role:tenant-a, applications, sync, tenant-workloads/orders-test, allow
      p, role:tenant-a, logs,         get,  tenant-workloads/*, allow
      g, tenant-a, role:tenant-a
      # Phase 4 A.4: Keycloak groups (realm lab, `groups` claim) map to the same roles.
      g, lab-platform-admins, role:admin
      g, lab-tenant-a, role:tenant-a
  cm:
    url: http://localhost:8080
    # Phase 4 A.4 fix: the UI is also served on argocd.localhost; Argo CD accepts SSO return and
    # callback URLs only for url + additionalUrls.
    additionalUrls: |
      - http://argocd.localhost:8080
    # Local accounts (Phase 3 A.2). Passwords are set via the API and never stored in Git.
    accounts.platform-admin: login
    accounts.tenant-a: login
    admin.enabled: "false"
    # Phase 4 A.4: SSO with Keycloak. Public client + PKCE: argocd-server runs the login
    # (callback /auth/callback, verifier kept server-side), so there is no client secret. argocd-server reaches the same issuer
    # URL through the CoreDNS rewrite in addons/keycloak. The local platform-admin account stays
    # as break-glass and for automation (review remark R-4).
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak.localhost:8080/realms/lab
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email"]
      # Logging out of Argo CD also ends the Keycloak session (RP-initiated logout); otherwise the
      # next "Log in via Keycloak" silently signs the same user back in and users cannot switch.
      logoutURL: http://keycloak.localhost:8080/realms/lab/protocol/openid-connect/logout?id_token_hint={{token}}&post_logout_redirect_uri={{logoutRedirectURL}}
    # Phase 3 C.2: every sync runs as the destinationServiceAccounts identity of its AppProject
    # (see scripts/audit-impersonation.sh; rollback: scripts/rollback-argocd-impersonation.sh).
    application.sync.impersonation.enabled: "true"
    # Phase 3 B.4 acceptance: applied by Argo CD to itself from Git (no helm upgrade).
    ui.bannercontent: "GitOps hub-and-spoke lab: Argo CD manages itself from Git (Phase 3 B.4)"
    application.links: |
      - title: "Headlamp Cluster Explorer"
        url: "http://headlamp.localhost:8080"
        description: "Open Multi-Cluster Kubernetes Dashboard"
        icon.class: "fa-th"
      - title: "Live Orders Dashboard (Dev)"
        url: "http://orders-dev.localhost:8081"
        description: "Open Dev Orders Dashboard"
        icon.class: "fa-external-link"
        if: "app.metadata.name == \"orders-dev\""
      - title: "Live Orders Dashboard (Test)"
        url: "http://orders-test.localhost:8081"
        description: "Open Test Orders Dashboard"
        icon.class: "fa-external-link"
        if: "app.metadata.name == \"orders-test\""
      - title: "Live Orders Dashboard (Prod)"
        url: "http://orders-prod.localhost:8082"
        description: "Open Prod Orders Dashboard"
        icon.class: "fa-external-link"
        if: "app.metadata.name == \"orders-prod\""
      - title: "Orders GitHub Repository"
        url: "https://github.com/brunobml/orders-processor"
        description: "Open Application Source Code on GitHub"
        icon.class: "fa-github"
        if: "app.metadata.name startsWith \"orders-\""
      - title: "Platform Golden Chart"
        url: "https://github.com/brunobml/platform-charts"
        description: "Open Platform Engineering Golden Path Chart"
        icon.class: "fa-cubes"
        if: "app.metadata.name startsWith \"orders-\""
      - title: "Central Moto Cloud API"
        url: "http://localhost:5000/moto-api/"
        description: "Inspect Mock AWS Cloud State (SQS & DynamoDB)"
        icon.class: "fa-cloud"
        if: "app.spec.project == \"tenant-workloads\""
    resource.links: |
      - title: "Headlamp Cluster Explorer"
        url: "http://headlamp.localhost:8080"
        description: "Open Multi-Cluster Kubernetes Dashboard"
        icon.class: "fa-th"
      - title: "Live Orders Dashboard (Dev)"
        url: "http://orders-dev.localhost:8081"
        description: "Open live orders web dashboard (Dev)"
        icon.class: "fa-external-link"
        if: "resource.metadata.namespace == \"orders-dev\""
      - title: "Live Orders Dashboard (Test)"
        url: "http://orders-test.localhost:8081"
        description: "Open live orders web dashboard (Test)"
        icon.class: "fa-external-link"
        if: "resource.metadata.namespace == \"orders-test\""
      - title: "Live Orders Dashboard (Prod)"
        url: "http://orders-prod.localhost:8082"
        description: "Open live orders web dashboard (Prod)"
        icon.class: "fa-external-link"
        if: "resource.metadata.namespace == \"orders-prod\""
      - title: "Central Moto Cloud API"
        url: "http://localhost:5000/moto-api/"
        description: "Inspect Mock AWS Cloud State (SQS & DynamoDB)"
        icon.class: "fa-cloud"
        if: "resource.metadata.namespace startsWith \"orders-\""
    resource.customizations: |
      kro.run/ResourceGraphDefinition:
        health.lua: |
          hs = {}
          if obj.status ~= nil then
            if obj.status.state == "Active" then
              hs.status = "Healthy"
              hs.message = "ResourceGraphDefinition is active and ready"
              return hs
            end
            if obj.status.conditions ~= nil then
              for i, condition in ipairs(obj.status.conditions) do
                if condition.type == "Ready" and condition.status == "True" then
                  hs.status = "Healthy"
                  hs.message = "ResourceGraphDefinition is ready"
                  return hs
                end
              end
            end
          end
          hs.status = "Progressing"
          hs.message = "Waiting for ResourceGraphDefinition to become active"
          return hs
      kro.run/*:
        health.lua: |
          hs = {}
          if obj.status ~= nil and obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message or "Ready"
                return hs
              end
            end
          end
          hs.status = "Progressing"
          hs.message = "Waiting for resource to become ready"
          return hs
      services.k8s.aws/*:
        health.lua: |
          hs = {}
          if obj.status ~= nil and obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "ACK.ResourceSynced" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = "ACK resource synced successfully"
                return hs
              end
            end
          end
          hs.status = "Progressing"
          hs.message = "Waiting for ACK resource sync"
          return hs
