# Policy Reporter UI on the hub (chart 3.9.1), one view of both spokes.
# The core is scaled to 0 (no Kyverno, no PolicyReports on the hub); the UI reads the spokes'
# APIs. ui.name equals a listed cluster, so the chart adds no "Default" (hub) cluster.
replicaCount: 0
image:
  tag: "3.9.0@sha256:a4db11f3c9259fd22fece5f86661c159232c1f4316243de6aa14e26a1cb966a0"

plugin:
  kyverno:
    enabled: false

ui:
  enabled: true
  # pinned by multi-arch index digest (lab rule L3-1); bump together with the chart version
  image:
    tag: "2.7.0@sha256:3b56a0a2393b0dcf20243d4ab4bdd1f4ff6ba2ba4dd5ab6538d4fbeaf8e99fb1"
  name: spoke-nonprod
  clusters:
    - name: spoke-nonprod
      secretRef: policy-reporter-cluster-spoke-nonprod
    - name: spoke-prod
      secretRef: policy-reporter-cluster-spoke-prod
  openIDConnect:
    enabled: true
    # discoveryUrl, clientId, clientSecret
    secretRef: policy-reporter-oidc
    callbackUrl: http://policy-reporter.localhost/callback
    groupClaim: groups
    scopes: [openid, profile, email]
  ingress:
    enabled: true
    className: traefik
    annotations:
      argocd.argoproj.io/ignore-default-links: "true"
    hosts:
      - host: policy-reporter.localhost
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}
  # Two views: tenant compliance and platform hygiene (the audit policies cover all namespaces
  # except kube-system, kyverno, kube-public, kube-node-lease)
  customBoards:
    - name: Tenants
      namespaces:
        list: [orders-dev, orders-test, orders-prod]
      clusterScope:
        enabled: false
    - name: Platform
      namespaces:
        list: [ack-system, kro, monitoring, platform-probes, policy-reporter, platform-network, admission-probes]
      clusterScope:
        enabled: false
