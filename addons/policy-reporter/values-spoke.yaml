# Policy Reporter on each Kyverno spoke (chart 3.9.1): the core (reads PolicyReports) and the
# Kyverno plugin (policy details, incl. ImageValidatingPolicies). No UI here: the one UI runs on
# the hub (values-hub.yaml, http://policy-reporter.localhost) and reads both spokes through
# their load balancers. The ingress routes /pr-core and /pr-kyverno only answer with the
# credentials scripts/setup-policy-reporter-secrets.sh creates (Traefik basic auth,
# addons/policy-reporter/spoke/middlewares.yaml); inside the cluster the APIs stay ClusterIP.
# The per-spoke ingress host (k3d-<spoke>-serverlb) is set by applicationsets/addons-spoke-policy-reporter.yaml.
# the hub UI reads results through the core's REST API; the chart enables it only together with a
# local UI (--rest-enabled = rest.enabled or ui.enabled), and there is no UI on the spokes
rest:
  enabled: true

# Keep reports about controller-owned pods. tenant-images-signed evaluates Pods directly (its
# autogen is off), so all its PolicyReports are about pods owned by a ReplicaSet; the chart's
# default (uncontrolledOnly: true) would drop every one of them and the UI would stay empty.
sourceFilters:
  - selector:
      sources: [kyverno, KyvernoValidatingPolicy, KyvernoImageValidatingPolicy]
    uncontrolledOnly: false
    disableClusterReports: false
    kinds:
      exclude: []

metrics:
  enabled: true
  mode: simple   # no per-resource names in time series

# images pinned by multi-arch index digest (lab rule L3-1); bump together with the chart version
image:
  tag: "3.9.0@sha256:a4db11f3c9259fd22fece5f86661c159232c1f4316243de6aa14e26a1cb966a0"

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {cpu: 200m, memory: 256Mi}

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: policy-reporter-pr-auth@kubernetescrd,policy-reporter-pr-core-strip@kubernetescrd

ui:
  enabled: false

plugin:
  kyverno:
    enabled: true
    image:
      tag: "0.7.0@sha256:971973638341f695e2e1911def80122c6c52ae1692d0a676fb70f2826372d415"
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: policy-reporter-pr-auth@kubernetescrd,policy-reporter-pr-kyverno-strip@kubernetescrd
