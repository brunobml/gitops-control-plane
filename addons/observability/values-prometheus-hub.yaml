# Phase 5 A.1: hub Prometheus + Alertmanager (chart prometheus-community/prometheus 29.35.0).
# Deployed by applicationsets/addon-prometheus.yaml. Spokes send their metrics here with
# remote write (Phase 5 A.3); hub-local targets are scraped directly.
#
# Prometheus and Alertmanager have NO UI ingress: Grafana (Keycloak SSO) is the single front
# door (Explore for queries, Alertmanager data source for alerts). The only ingress is the
# remote-write path, behind basic auth (one credential per spoke, outside Git).

configmapReload:
  prometheus:
    containerSecurityContext:              # Phase 5 F.0: PSS restricted
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: ["ALL"]}
    image:
      digest: "sha256:06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b"  # v0.94.1

server:
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: {type: RuntimeDefault}   # Phase 5 F.0: PSS restricted
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  image:
    digest: "sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e"  # v3.15.0
  retention: "7d"
  extraFlags:
    - web.enable-lifecycle
    - web.enable-remote-write-receiver
  persistentVolume:
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  global:
    scrape_interval: 30s
    evaluation_interval: 30s

alertmanager:
  image:
    tag: "v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a"
  configmapReload:
    image:
      tag: "v0.94.1@sha256:06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b"
  persistence:
    size: 256Mi
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  config:
    # Owner decision O-1: alerts stay lab-local (Alertmanager + Grafana). Adding an external
    # channel later = one more receiver here.
    route:
      receiver: lab-local
      group_by: [alertname, cluster, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: lab-local

kube-state-metrics:
  image:
    sha: "sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b"  # v2.20.0
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

prometheus-node-exporter:
  enabled: false   # k3d nodes are containers on one kernel
prometheus-pushgateway:
  enabled: false

extraManifests:
  # Remote-write endpoint for the spoke agents: only /api/v1/write, only with a spoke credential.
  # Spokes reach the hub load balancer by its container name on the k3d network.
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: remote-write-auth
      namespace: monitoring
    spec:
      basicAuth:
        secret: remote-write-htpasswd
        headerField: X-Remote-Spoke
        removeHeader: true
  - |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: prometheus-remote-write
      namespace: monitoring
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: monitoring-remote-write-auth@kubernetescrd
    spec:
      ingressClassName: traefik
      rules:
        - host: k3d-hub-cluster-serverlb
          http:
            paths:
              - path: /api/v1/write
                pathType: Exact
                backend:
                  service:
                    name: prometheus-server
                    port:
                      number: 80

# Phase 5 A.5: synthetic probes through the blackbox exporter (module per target).
extraScrapeConfigs: |
  - job_name: blackbox
    metrics_path: /probe
    static_configs:
      - targets: ["http://traefik.traefik.svc/healthz"]
        labels: {module: argocd, probe: argocd-ui}
      - targets: ["http://traefik.traefik.svc/api/health"]
        labels: {module: grafana, probe: grafana-ui}
      - targets: ["http://traefik.traefik.svc/"]
        labels: {module: headlamp_requires_sso, probe: headlamp-sso}
      - targets: ["http://keycloak.localhost:8080/realms/lab/.well-known/openid-configuration"]
        labels: {module: http_2xx, probe: keycloak-oidc}
      - targets: ["http://moto-cloud:5000/moto-api/"]
        labels: {module: http_2xx, probe: moto}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [module], target_label: __param_module}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115}
  # Phase 5 F.4: log pipeline health on the hub (Alloy shipping, Loki itself)
  - job_name: alloy
    static_configs:
      - targets: ["alloy.monitoring.svc:12345"]
        labels: {cluster: hub}
    metric_relabel_configs:
      - {source_labels: [__name__], regex: "loki_write_(sent_entries_total|dropped_entries_total|request_duration_seconds_count)", action: keep}
  - job_name: loki
    static_configs:
      - targets: ["loki.monitoring.svc:3100"]
    metric_relabel_configs:
      - {source_labels: [__name__], regex: "loki_build_info|loki_distributor_lines_received_total", action: keep}

# Phase 5 B: alerts for failure modes seen in Phases 2-4. Each has a runbook section.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: lab.argocd
        rules:
          - alert: ArgoAppDegraded
            expr: argocd_app_info{health_status!="Healthy"}
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Application {{ $labels.name }} is {{ $labels.health_status }}"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-argoappdegraded--argoappoutofsync
              logs: "http://grafana.localhost:8080/d/lab-logs?var-namespace={{ $labels.dest_namespace }}"
          - alert: ArgoAppOutOfSync
            # argo-cd itself is manual-sync by design (Phase 3 D-32)
            expr: argocd_app_info{sync_status!="Synced", name!="argo-cd"}
            for: 30m
            labels: {severity: warning}
            annotations:
              summary: "Application {{ $labels.name }} is {{ $labels.sync_status }}"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-argoappdegraded--argoappoutofsync
          - alert: ArgoClusterUnreachable
            expr: argocd_cluster_connection_status != 1
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "Argo CD cannot reach {{ $labels.server }}"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-argoclusterunreachable
      - name: lab.credentials
        rules:
          - alert: SpokeTokenExpiringSoon
            expr: (lab_credential_expiry_timestamp_seconds - time()) < 7 * 86400
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Credential {{ $labels.credential }} expires in {{ $value | humanizeDuration }}"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-spoketokenexpiringsoon
          - alert: CredentialExpiryUnknown
            expr: absent(lab_credential_expiry_timestamp_seconds)
            for: 30m
            labels: {severity: warning}
            annotations:
              summary: "No credential expiry data (exporter down or ConfigMap missing)"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-spoketokenexpiringsoon
      - name: lab.spokes
        rules:
          - alert: SpokeAgentDown
            expr: absent_over_time(up{job="agent", cluster="spoke-nonprod"}[5m]) or absent_over_time(up{job="agent", cluster="spoke-prod"}[5m])
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "No metrics from a spoke agent"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-spokeagentdown--spokecontrollerdown
          - alert: KyvernoDown
            # A stopped Kyverno disappears from discovery instead of reporting up=0 (Phase 4 D-10:
            # a graceful stop also removes its webhooks, so tenant admission fails open).
            expr: count by (cluster) (up{job="agent"} == 1) unless count by (cluster) (up{job="kyverno"} == 1)
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "Kyverno is not running on {{ $labels.cluster }}: image verification is not enforced"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-kyvernodown
              logs: "http://grafana.localhost:8080/d/lab-logs?var-cluster={{ $labels.cluster }}&var-namespace=kyverno"
          - alert: KyvernoSlowAdmission
            expr: histogram_quantile(0.95, sum by (le, cluster) (rate(kyverno_admission_review_duration_seconds_bucket[5m]))) > 15
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Kyverno p95 admission latency {{ $value | humanize }}s on {{ $labels.cluster }} (webhook timeout 30 s)"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-kyvernodown
          - alert: SpokeControllerDown
            expr: (count by (cluster) (up{job="agent"} == 1) unless count by (cluster) (up{job="kro"} == 1)) or (count by (cluster) (up{job="agent"} == 1) unless count by (cluster) (up{job="ack-sqs"} == 1))
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "kro or ACK controller not running on {{ $labels.cluster }}"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-spokeagentdown--spokecontrollerdown
              logs: "http://grafana.localhost:8080/d/lab-logs?var-cluster={{ $labels.cluster }}&var-namespace=kro&var-namespace=ack-system"
      - name: lab.logs
        rules:
          - alert: LokiDown
            expr: up{job="loki"} == 0 or absent(up{job="loki"})
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "Loki is down: no logs are stored (Grafana logs panels empty)"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing
          - alert: LogShipperDown
            # spokes: agent alive but no healthy Alloy target; hub: Alloy scrape missing or down
            expr: (count by (cluster) (up{job="agent"} == 1) unless count by (cluster) (up{job="alloy"} == 1)) or (up{job="alloy", cluster="hub"} == 0) or absent(up{job="alloy", cluster="hub"})
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Alloy is not running on {{ $labels.cluster }}: its logs are not collected"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing
          - alert: LogsMissing
            expr: sum by (cluster) (rate(loki_write_sent_entries_total[15m])) == 0
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "No log lines shipped from {{ $labels.cluster }} for 15 min"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing
          - alert: LokiIngestionErrors
            expr: sum by (cluster, reason) (rate(loki_write_dropped_entries_total[10m])) > 0
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.cluster }} is dropping log lines ({{ $labels.reason }})"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing
      - name: lab.probes
        rules:
          - alert: OrdersNotProcessed
            # Phase 3 F-1: workers silently stopped processing after moto lost their IAM keys.
            expr: lab_order_e2e_success == 0
            for: 10m
            labels: {severity: critical}
            annotations:
              summary: "Synthetic order not processed in {{ $labels.namespace }} on {{ $labels.cluster }}"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-ordersnotprocessed
              logs: "http://grafana.localhost:8080/d/lab-logs?var-cluster={{ $labels.cluster }}&var-namespace={{ $labels.namespace }}"
          - alert: SyntheticProbeStale
            expr: time() - lab_order_e2e_last_run_timestamp_seconds > 900
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Synthetic order probe on {{ $labels.cluster }} has not completed a run for 15 min"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-ordersnotprocessed
          - alert: ProbeFailed
            expr: probe_success{job="blackbox"} == 0
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Probe {{ $labels.probe }} failing ({{ $labels.instance }})"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-probefailed
