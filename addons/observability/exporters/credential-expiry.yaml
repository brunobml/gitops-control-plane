apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-expiry-exporter
  labels: {app.kubernetes.io/name: credential-expiry-exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: credential-expiry-exporter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: credential-expiry-exporter}
    spec:
      automountServiceAccountToken: false   # needs no Kubernetes API access at all
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: exporter
          # same digest-pinned base image as orders-processor (Phase 4 B.1)
          image: docker.io/library/python:3.11-alpine@sha256:9a725b14f2ae4e1b92ae4c7a8f575c7bf0f451276b5d38c9ec20bb005d0063a8
          command: ["python3", "-u", "/app/credential_expiry_exporter.py"]
          ports: [{name: metrics, containerPort: 9101}]
          readinessProbe: {httpGet: {path: /healthz, port: metrics}, periodSeconds: 30}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: expiry, mountPath: /expiry, readOnly: true}
      volumes:
        - name: app
          configMap: {name: credential-expiry-exporter}
        - name: expiry
          configMap:
            name: credential-expiry   # written by the token scripts, not by Argo CD
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: credential-expiry-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9101"
spec:
  selector: {app.kubernetes.io/name: credential-expiry-exporter}
  ports: [{name: metrics, port: 9101, targetPort: metrics}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: credential-expiry-exporter
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: credential-expiry-exporter}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/component: server}
      ports: [{port: 9101}]
  egress: []
