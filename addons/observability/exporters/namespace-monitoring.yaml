apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    # Never pruned or deleted with this addon: the namespace also holds Prometheus, Grafana, Loki.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    # Phase 5 F.0: Pod Security restricted (all monitoring workloads verified with --dry-run=server)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
