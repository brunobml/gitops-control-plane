# Phase 5 B: promtool unit tests for the hub alert rules (run: make test-alert-rules).
# The rules file is rendered from values-prometheus-hub.yaml by the make target.
rule_files: [alerting_rules.yml]
evaluation_interval: 30s
tests:
  - name: KyvernoDown when a spoke's Kyverno target disappears (graceful stop, Phase 4 D-10)
    interval: 30s
    input_series:
      - {series: 'up{job="agent",cluster="spoke-nonprod"}', values: '1x20'}
      # a target that leaves service discovery gets staleness markers (also sent via remote write)
      - {series: 'up{job="kyverno",cluster="spoke-nonprod"}', values: '1 1 stale'}
      - {series: 'up{job="agent",cluster="spoke-prod"}', values: '1x20'}
      - {series: 'up{job="kyverno",cluster="spoke-prod"}', values: '1x20'}
    alert_rule_test:
      - {eval_time: 1m, alertname: KyvernoDown, exp_alerts: []}
      - eval_time: 5m
        alertname: KyvernoDown
        exp_alerts:
          - exp_labels: {severity: critical, cluster: spoke-nonprod}
            exp_annotations: {summary: "Kyverno is not running on spoke-nonprod: image verification is not enforced", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-kyvernodown", logs: "http://grafana.localhost/d/lab-logs?var-cluster=spoke-nonprod&var-namespace=kyverno"}
  - name: SpokeControllerDown for kro, not for a healthy ACK
    interval: 30s
    input_series:
      - {series: 'up{job="agent",cluster="spoke-prod"}', values: '1x30'}
      - {series: 'up{job="kro",cluster="spoke-prod"}', values: '0x30'}
      - {series: 'up{job="ack-sqs",cluster="spoke-prod"}', values: '1x30'}
    alert_rule_test:
      - eval_time: 10m
        alertname: SpokeControllerDown
        exp_alerts:
          - exp_labels: {severity: critical, cluster: spoke-prod}
            exp_annotations: {summary: "kro or ACK controller not running on spoke-prod", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-spokeagentdown--spokecontrollerdown", logs: "http://grafana.localhost/d/lab-logs?var-cluster=spoke-prod&var-namespace=kro&var-namespace=ack-system"}
  - name: SpokeAgentDown when a spoke stops sending
    interval: 30s
    input_series:
      - {series: 'up{job="agent",cluster="spoke-nonprod"}', values: '1x40'}
      - {series: 'up{job="agent",cluster="spoke-prod"}', values: '1 _x40'}
    alert_rule_test:
      - {eval_time: 3m, alertname: SpokeAgentDown, exp_alerts: []}
      - eval_time: 15m
        alertname: SpokeAgentDown
        exp_alerts:
          - exp_labels: {severity: warning, job: agent, cluster: spoke-prod}
            exp_annotations: {summary: "No metrics from a spoke agent", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-spokeagentdown--spokecontrollerdown"}
  - name: SpokeTokenExpiringSoon below 7 days only
    interval: 1m
    input_series:
      - {series: 'lab_credential_expiry_timestamp_seconds{credential="argocd-spoke-prod"}', values: '172800x10'}      # t=0 + 2 days
      - {series: 'lab_credential_expiry_timestamp_seconds{credential="argocd-spoke-nonprod"}', values: '2592000x10'}  # + 30 days
    alert_rule_test:
      - eval_time: 6m
        alertname: SpokeTokenExpiringSoon
        exp_alerts:
          - exp_labels: {severity: warning, credential: argocd-spoke-prod}
            exp_annotations:
              summary: "Credential argocd-spoke-prod expires in 1d 23h 54m 0s"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-spoketokenexpiringsoon
  - name: CredentialExpiryUnknown when the exporter is gone
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 31m
        alertname: CredentialExpiryUnknown
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "No credential expiry data (exporter down or ConfigMap missing)", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-spoketokenexpiringsoon"}
  - name: OrdersNotProcessed and SyntheticProbeStale
    interval: 1m
    input_series:
      - {series: 'lab_order_e2e_success{cluster="spoke-nonprod",namespace="orders-dev"}', values: '0x20'}
      - {series: 'lab_order_e2e_last_run_timestamp_seconds{cluster="spoke-nonprod"}', values: '0x30'}
    alert_rule_test:
      - eval_time: 12m
        alertname: OrdersNotProcessed
        exp_alerts:
          - exp_labels: {severity: critical, cluster: spoke-nonprod, namespace: orders-dev}
            exp_annotations: {summary: "Synthetic order not processed in orders-dev on spoke-nonprod", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-ordersnotprocessed", logs: "http://grafana.localhost/d/lab-logs?var-cluster=spoke-nonprod&var-namespace=orders-dev"}
      - eval_time: 21m
        alertname: SyntheticProbeStale
        exp_alerts:
          - exp_labels: {severity: warning, cluster: spoke-nonprod}
            exp_annotations: {summary: "Synthetic order probe on spoke-nonprod has not completed a run for 15 min", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-ordersnotprocessed"}
  - name: KyvernoSlowAdmission above 15 s p95
    interval: 1m
    input_series:
      - {series: 'kyverno_admission_review_duration_seconds_bucket{cluster="spoke-prod",le="10"}', values: '0+0x20'}
      - {series: 'kyverno_admission_review_duration_seconds_bucket{cluster="spoke-prod",le="20"}', values: '0+10x20'}
      - {series: 'kyverno_admission_review_duration_seconds_bucket{cluster="spoke-prod",le="+Inf"}', values: '0+10x20'}
    alert_rule_test:
      - eval_time: 15m
        alertname: KyvernoSlowAdmission
        exp_alerts:
          - exp_labels: {severity: warning, cluster: spoke-prod}
            exp_annotations: {summary: "Kyverno p95 admission latency 19.5s on spoke-prod (webhook timeout 30 s)", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-kyvernodown"}
  - name: ArgoAppOutOfSync ignores the manual-sync argo-cd app
    interval: 1m
    input_series:
      - {series: 'argocd_app_info{name="argo-cd",sync_status="OutOfSync",health_status="Healthy"}', values: '1x40'}
      - {series: 'argocd_app_info{name="orders-dev",sync_status="OutOfSync",health_status="Healthy"}', values: '1x40'}
    alert_rule_test:
      - eval_time: 35m
        alertname: ArgoAppOutOfSync
        exp_alerts:
          - exp_labels: {severity: warning, name: orders-dev, sync_status: OutOfSync, health_status: Healthy}
            exp_annotations: {summary: "Application orders-dev is OutOfSync", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-argoappdegraded--argoappoutofsync"}
  - name: LogShipperDown when a spoke's Alloy disappears, and for the hub's Alloy
    interval: 30s
    input_series:
      - {series: 'up{job="agent",cluster="spoke-prod"}', values: '1x30'}
      - {series: 'up{job="alloy",cluster="spoke-prod"}', values: '1 1 stale'}
      - {series: 'up{job="alloy",cluster="hub"}', values: '0x30'}
    alert_rule_test:
      - eval_time: 10m
        alertname: LogShipperDown
        exp_alerts:
          - exp_labels: {severity: warning, cluster: spoke-prod}
            exp_annotations: {summary: "Alloy is not running on spoke-prod: its logs are not collected", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing"}
          - exp_labels: {severity: warning, job: alloy, cluster: hub}
            exp_annotations: {summary: "Alloy is not running on hub: its logs are not collected", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing"}
  - name: LogsMissing and LokiIngestionErrors
    interval: 1m
    input_series:
      - {series: 'loki_write_sent_entries_total{cluster="spoke-nonprod"}', values: '100x40'}
      - {series: 'loki_write_sent_entries_total{cluster="hub"}', values: '0+60x40'}
      - {series: 'loki_write_dropped_entries_total{cluster="hub",reason="rate_limited"}', values: '0+5x40'}
    alert_rule_test:
      - eval_time: 35m
        alertname: LogsMissing
        exp_alerts:
          - exp_labels: {severity: warning, cluster: spoke-nonprod}
            exp_annotations: {summary: "No log lines shipped from spoke-nonprod for 15 min", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing"}
      - eval_time: 25m
        alertname: LokiIngestionErrors
        exp_alerts:
          - exp_labels: {severity: warning, cluster: hub, reason: rate_limited}
            exp_annotations: {summary: "hub is dropping log lines (rate_limited)", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing"}
  - name: LokiDown when the Loki target is missing
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: LokiDown
        exp_alerts:
          - exp_labels: {severity: critical, job: loki}
            exp_annotations: {summary: "Loki is down: no logs are stored (Grafana logs panels empty)", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-lokidown--logshipperdown--logsmissing"}
  - name: ContainerOOMKilled after a restart with reason OOMKilled
    interval: 1m
    input_series:
      - {series: 'kube_pod_container_status_restarts_total{cluster="spoke-nonprod",namespace="x",pod="p",container="c"}', values: '0 0 1 1 1'}
      - {series: 'kube_pod_container_status_last_terminated_reason{cluster="spoke-nonprod",namespace="x",pod="p",container="c",reason="OOMKilled"}', values: '1x5'}
    alert_rule_test:
      - eval_time: 4m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels: {severity: warning, cluster: spoke-nonprod, namespace: x, pod: p, container: c}
            exp_annotations: {summary: "x/p container c was OOM-killed on spoke-nonprod", runbook: "docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-containeroomkilled", logs: "http://grafana.localhost/d/lab-logs?var-cluster=spoke-nonprod&var-namespace=x"}
  # 2026-10-03 Track A.4
  - name: CIFailingOnMain only for the red workflow, across a new commit (sha label)
    interval: 1m
    input_series:
      - {series: 'lab_ci_run_success{repo="platform-catalog",workflow="CI",sha="aaaaaaa",instance="x"}', values: '0x3 _x10'}
      - {series: 'lab_ci_run_success{repo="platform-catalog",workflow="CI",sha="bbbbbbb",instance="x"}', values: '_x3 0x10'}
      - {series: 'lab_ci_run_success{repo="tenant-workloads",workflow="CI",sha="ccccccc",instance="x"}', values: '1x13'}
    alert_rule_test:
      - eval_time: 4m
        alertname: CIFailingOnMain
        exp_alerts: []
      - eval_time: 7m
        alertname: CIFailingOnMain
        exp_alerts:
          - exp_labels: {severity: warning, repo: platform-catalog, workflow: CI}
            exp_annotations:
              summary: "CI CI is failing on main of platform-catalog"
              link: "https://github.com/brunobml/platform-catalog/actions?query=branch%3Amain"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-cifailingonmain--cistatusunknown
  - name: CIStatusUnknown when polling fails
    interval: 1m
    input_series:
      - {series: 'lab_ci_poll_timestamp_seconds{instance="x"}', values: '0+60x40'}
      - {series: 'lab_ci_poll_success{instance="x"}', values: '0x40'}
    alert_rule_test:
      - eval_time: 29m
        alertname: CIStatusUnknown
        exp_alerts: []
      - eval_time: 31m
        alertname: CIStatusUnknown
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "CI status of the lab repositories is unknown (exporter down, no internet or GitHub rate limit)"
              runbook: docs/runbooks/host-reboot-and-cluster-lifecycle.md#alert-cifailingonmain--cistatusunknown

