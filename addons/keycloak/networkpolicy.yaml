# Only Traefik reaches Keycloak (2026-10-03 Track I.1). The browser and every in-cluster OIDC
# client (argocd-server, oauth2-proxy, Grafana, the blackbox probe, the smoke test) use the same
# URL, http://keycloak.localhost, which resolves to Traefik inside the hub as well
# (addons/keycloak/coredns-custom.yaml), so none of them connects to the Keycloak pod directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports:
        - port: 8080
