# Only Traefik (browser path), argocd-server, oauth2-proxy and Grafana (in-cluster OIDC) reach Keycloak.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
          podSelector:
            matchLabels: {app.kubernetes.io/name: argocd-server}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: oauth2-proxy}
        # Phase 5 A.4: Grafana (OIDC token and userinfo calls)
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
        # Phase 5 A.5: blackbox probe of the OIDC discovery endpoint
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus-blackbox-exporter}
      ports:
        - port: 8080
