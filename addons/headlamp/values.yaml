# Headlamp Values for Hub-and-Spoke GitOps Management Control Plane
# Deployed on: k3d-hub-cluster
# Access URL: http://headlamp.localhost

automountServiceAccountToken: false

clusterRoleBinding:
  create: false

config:
  # Multi-cluster setup via mounted kubeconfig containing all 3 clusters:
  # - k3d-hub-cluster (in-cluster hub management)
  # - k3d-spoke-nonprod (dev/test workload cluster)
  # - k3d-spoke-prod (production workload cluster)
  inCluster: false
  extraArgs:
    - "-kubeconfig=/home/headlamp/.kube/config"
  oidc:
    secret:
      create: false

# Probe configuration to avoid startup connection refused warnings
probes:
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

# Mount multi-cluster kubeconfig secret
volumeMounts:
  - name: kubeconfig
    mountPath: /home/headlamp/.kube/config
    subPath: config
    readOnly: true

volumes:
  - name: kubeconfig
    secret:
      secretName: headlamp-kubeconfig

# Traefik Ingress configuration on the hub (host port 80, Track I)
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    argocd.argoproj.io/ignore-default-links: "true"
    # Phase 4 A.5: SSO via oauth2-proxy (addon-oauth2-proxy owns this Middleware).
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-oauth2-forward-auth@kubernetescrd
    link.argocd.argoproj.io/external-link: "http://headlamp.localhost"
  hosts:
    - host: headlamp.localhost
      paths:
        - path: /
          type: Prefix

# Resource allocations aligned with Well-Architected Framework
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
