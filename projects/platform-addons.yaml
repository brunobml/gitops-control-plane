apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-addons
  namespace: argocd
  annotations:
    # Phase 3 B.1: never prune an AppProject that apps may still reference.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: "Phase 3 B.2: spoke platform controllers (kro, ACK) managed from Git"
  sourceRepos:
    - "https://github.com/brunobml/platform-catalog.git"
    - "https://github.com/brunobml/gitops-control-plane.git"
    - "registry.k8s.io/kro/charts"
    - "public.ecr.aws/aws-controllers-k8s"
    - "https://kyverno.github.io/kyverno/"   # Phase 4 B.3
    - "https://kyverno.github.io/policy-reporter"
    - "https://prometheus-community.github.io/helm-charts"   # Phase 5 A.3
    - "https://grafana.github.io/helm-charts"                # Phase 5 F.2 Alloy
  destinations:
    - name: "spoke-nonprod"
      namespace: "kro"
    - name: "spoke-nonprod"
      namespace: "ack-system"
    - name: "spoke-prod"
      namespace: "kro"
    - name: "spoke-prod"
      namespace: "ack-system"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "kro"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "ack-system"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "kro"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "ack-system"
    - name: "spoke-nonprod"
      namespace: "kube-system"
    - name: "spoke-prod"
      namespace: "kube-system"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "kube-system"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "kube-system"
    # Phase 5 A.3: Prometheus agents
    - name: "spoke-nonprod"
      namespace: "monitoring"
    - name: "spoke-prod"
      namespace: "monitoring"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "monitoring"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "monitoring"
    # Phase 5 B.2: synthetic order probe
    - name: "spoke-nonprod"
      namespace: "platform-probes"
    - name: "spoke-prod"
      namespace: "platform-probes"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "platform-probes"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "platform-probes"
    # Phase 4 B.3: Kyverno
    - name: "spoke-nonprod"
      namespace: "kyverno"
    - name: "spoke-prod"
      namespace: "kyverno"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "kyverno"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "kyverno"
    - name: "spoke-nonprod"
      namespace: "policy-reporter"
    - name: "spoke-prod"
      namespace: "policy-reporter"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "policy-reporter"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "policy-reporter"
    # Bats Test Reporter
    - name: "spoke-nonprod"
      namespace: "platform-reports"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "platform-reports"
  # Controllers ship CRDs, ClusterRoles and webhooks; cluster-scoped access is intended here
  # (narrowed later by C.3 kro aggregation and C.2 destination impersonation).
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  # Phase 3 C.2: identity Argo CD impersonates when syncing (application.sync.impersonation.enabled).
  destinationServiceAccounts:
    - server: "*"
      namespace: "*"
      defaultServiceAccount: "kube-system:argocd-platform-deployer"
