apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-addons
  namespace: argocd
  annotations:
    # Phase 3 B.1: never prune an AppProject that apps may still reference.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: "Phase 3 B.2: spoke platform controllers (kro, ACK) managed from Git"
  sourceRepos:
    - "https://github.com/brunobml/platform-catalog.git"
    - "registry.k8s.io/kro/charts"
    - "public.ecr.aws/aws-controllers-k8s"
  destinations:
    - name: "spoke-nonprod"
      namespace: "kro"
    - name: "spoke-nonprod"
      namespace: "ack-system"
    - name: "spoke-prod"
      namespace: "kro"
    - name: "spoke-prod"
      namespace: "ack-system"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "kro"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "ack-system"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "kro"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "ack-system"
  # Controllers ship CRDs, ClusterRoles and webhooks; cluster-scoped access is intended here
  # (narrowed later by C.3 kro aggregation and C.2 destination impersonation).
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
