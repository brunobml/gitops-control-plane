apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: control-plane
  namespace: argocd
  annotations:
    # Phase 3 B.1: never prune an AppProject that apps may still reference.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: "Core GitOps control plane and cluster management"
  sourceRepos:
    - "https://github.com/brunobml/gitops-control-plane.git"
    - "https://kubernetes-sigs.github.io/headlamp/"
    - "https://traefik.github.io/charts"
    - "https://argoproj.github.io/argo-helm"   # Phase 3 B.4: Argo CD manages itself
    - "https://oauth2-proxy.github.io/manifests"  # Phase 4 A.5: Headlamp SSO
    - "https://prometheus-community.github.io/helm-charts"  # Phase 5 A.1/A.3/A.5
    - "https://grafana-community.github.io/helm-charts"     # Phase 5 A.4 (grafana/grafana chart is deprecated), F.1 Loki
    - "https://grafana.github.io/helm-charts"               # Phase 5 F.2 Alloy
  destinations:
    - server: "https://kubernetes.default.svc"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  # Phase 3 C.2: identity Argo CD impersonates when syncing (application.sync.impersonation.enabled).
  destinationServiceAccounts:
    - server: "https://kubernetes.default.svc"
      namespace: "*"
      defaultServiceAccount: "argocd:argocd-platform-deployer"
