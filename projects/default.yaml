apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    # Phase 3 B.1: never prune an AppProject that apps may still reference.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: "Default locked-down project (unused)"
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: []
  # Phase 3 C.2: identity Argo CD impersonates when syncing (application.sync.impersonation.enabled).
  destinationServiceAccounts:
    # Deliberately a non-existent identity: nothing may be deployed through the default project.
    - server: "*"
      namespace: "*"
      defaultServiceAccount: "kube-system:argocd-default-project-denied"
