apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-workloads
  namespace: argocd
  annotations:
    # Phase 3 B.1: never prune an AppProject that apps may still reference.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: "Multi-tenant application workloads (Tenant-A, etc.)"
  sourceRepos:
    - "https://github.com/brunobml/orders-processor.git"
    - "ghcr.io/brunobml/charts"
  destinations:
    - name: "spoke-nonprod"
      namespace: "orders-*"
    - name: "spoke-prod"
      namespace: "orders-*"
    - name: "spoke-nonprod"
      namespace: "tenant-*"
    - name: "spoke-prod"
      namespace: "tenant-*"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "orders-*"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "orders-*"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "tenant-*"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "tenant-*"
  clusterResourceWhitelist:
    - group: ""
      kind: "Namespace"
  # Phase 3 C.1 was reverted by owner decision (2026-10-01): Argo CD uses this whitelist both
  # to limit what an app may deploy AND to filter what its resource tree shows, so narrowing it
  # to QueueBackedService hid the Deployments/Pods/Queues kro creates. In this lab full
  # visibility wins. Residual risk is low because tenant-a cannot create or edit Applications
  # (Argo CD RBAC, Phase 3 A.2), so tenants cannot make Argo CD render arbitrary manifests.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  # Phase 3 C.2: identity Argo CD impersonates when syncing (application.sync.impersonation.enabled).
  destinationServiceAccounts:
    # Tenant apps address clusters by name; server "*" matches regardless. Destinations above
    # still restrict which clusters/namespaces are allowed.
    - server: "*"
      namespace: "orders-*"
      defaultServiceAccount: "kube-system:argocd-tenant-deployer"
    - server: "*"
      namespace: "tenant-*"
      defaultServiceAccount: "kube-system:argocd-tenant-deployer"
