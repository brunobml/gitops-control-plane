apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-workloads
  namespace: argocd
  annotations:
    # Phase 3 B.1: never prune an AppProject that apps may still reference.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: "Multi-tenant application workloads (Tenant-A, etc.)"
  sourceRepos:
    - "https://github.com/brunobml/orders-processor.git"
    - "ghcr.io/brunobml/charts"
  destinations:
    - name: "spoke-nonprod"
      namespace: "orders-*"
    - name: "spoke-prod"
      namespace: "orders-*"
    - name: "spoke-nonprod"
      namespace: "tenant-*"
    - name: "spoke-prod"
      namespace: "tenant-*"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "orders-*"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "orders-*"
    - server: "https://k3d-spoke-nonprod-server-0:6443"
      namespace: "tenant-*"
    - server: "https://k3d-spoke-prod-server-0:6443"
      namespace: "tenant-*"
  clusterResourceWhitelist:
    - group: ""
      kind: "Namespace"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
